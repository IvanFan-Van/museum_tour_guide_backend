[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "apiexception>=0.2.1",
    "chromadb>=1.1.1",
    "colorlog>=6.10.1",
    "ddgs>=9.10.0",
    "fastapi>=0.118.0",
    "jieba>=0.42.1",
    "langchain-community>=0.3.31",
    "langchain-ollama>=0.3.10",
    "langchain-openai>=0.3.35",
    "langchain[core]>=1.2.10",
    "langgraph>=0.6.9",
    "langgraph-api>=0.7.60",
    "langgraph-cli>=0.4.2",
    "langgraph-sdk>=0.2.9",
    "nltk>=3.9.2",
    "pip>=25.2",
    "pydantic>=2.12.0",
    "pytest-asyncio>=1.2.0",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "regex>=2026.2.28",
    "sentence-transformers>=5.2.3",
    "spacy>=3.8.7",
    "supabase>=2.28.0",
    "uvicorn>=0.37.0",
    "websockets>=15.0.1",
]

[dependency-groups]
dev = [
    "huggingface-hub[hf-xet]>=0.35.3",
    "ipykernel>=7.0.0",
    "ipywidgets>=8.1.8",
    "langgraph-cli[inmem]>=0.4.2",
    "notebook>=7.4.7",
    "pytest>=8.4.2",
]

# [tool.pytest.ini_options]
# pythonpath = ["src"]

[tool.mypy]
files = ['src']
mypy_path = "src"

[tool.pyright]
include = ["src"]
pythonVersion = "3.12"
venv = ".venv"
venvPath = "."
